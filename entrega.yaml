apiVersion: v1
kind: Service
metadata:
  name: svc-daniel-romero
  namespace: ns-daniel-romero
  labels:
    app: tarea-final
spec:
  type: ClusterIP
  selector:
    app: tarea-final
  ports:
    - name: http
      port: 80
