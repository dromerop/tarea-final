---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-daniel-romero
  namespace: ns-daniel-romero
  labels:
    app: tarea-final
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tarea-final
  template:
    metadata:
      labels:
        app: tarea-final
    spec:
      containers:
        - name: tarea-final
          #          image: dromerocl/tarea-final:daniel-romero
          image: ghcr.io/dromerop/tarea-final:daniel-romero
          imagePullPolicy: Always
          env:
            - name: AMBIENTE
              valueFrom:
                configMapKeyRef:
                  name: config-daniel-romero
                  key: AMBIENTE
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: secret-daniel-romero
                  key: API_KEY
          ports:
            - containerPort: 80